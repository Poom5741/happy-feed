name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run fetch
        env:
          RSS_BRIDGE: ${{ secrets.RSS_BRIDGE || vars.RSS_BRIDGE }}
          RSS_BRIDGE_FACEBOOK: ${{ secrets.RSS_BRIDGE_FACEBOOK || vars.RSS_BRIDGE_FACEBOOK }}
      - run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
